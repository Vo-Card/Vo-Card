<svg width="175" height="239" viewBox="0 0 175 239" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <rect x="1" y="1" width="173.17" height="236.93" rx="8" fill="{primary_color}"/>
    <rect x="1" y="1" width="173.17" height="236.93" rx="8" fill="url(#paint_radial_{card_id})"/>
    <rect x="1" y="1" width="173.17" height="236.93" rx="8" style="mix-blend-mode:overlay" fill="url(#card_pattern_{card_id})"/>
    <rect x="1" y="1" width="173.17" height="236.93" rx="8" stroke="white"/>
    <line x1="152.5" y1="11" x2="152.5" y2="74" stroke="white"/>
    <line x1="165" y1="25.5" x2="122" y2="25.5" stroke="white"/>
    <rect x="158" y="11" width="7" height="7" fill="#D9D9D9"/>
    <rect x="158" y="222" width="7" height="7" fill="#D9D9D9"/>
    <text id="fit-text"
        x="50%" y="50%"
        dominant-baseline="middle"
        text-anchor="middle"
        fill="white"
        font-size="20"
        font-family="var(--primary-font)"
        filter="url(#colored_glow_{card_id})">
    {word_content}
    </text>

    <text
        x="5%" y="10%"
        dominant-baseline="middle"
        text-anchor="left"
        fill="white"
        font-size="15"
        font-family="var(--primary-font)"
        filter="url(#colored_glow_{card_id})">
    {top_indicator}
    </text>

    <text
        x="5%" y="90%"
        dominant-baseline="middle"
        text-anchor="left"
        fill="white"
        font-size="20"
        font-family="var(--primary-font)"
        filter="url(#colored_glow_{card_id})">
    {ii}
    </text>

<defs>
    <radialGradient id="paint_radial_{card_id}" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(87.585 119.465) rotate(135.227) scale(187.47 329.921)">
        <stop stop-opacity="0"/>
        <stop offset="1" stop-color="{secondary_color}"/>
    </radialGradient>
    <pattern id="card_pattern_{card_id}" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="2" fill="white" />
    </pattern>
    <filter id="colored_glow_{card_id}" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
        <feFlood flood-color="#ffffff" result="color"/>
        <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>
</svg>

