name: Pull Request
description: Submit a code change to improve the project
body:
  - type: dropdown
    id: scope
    attributes:
      label: Which scope does this PR touch?
      options:
        - api
        - backend
        - card
        - core
        - component
        - database
        - deck
        - documentation
        - functionality
        - security
        - structure
        - page
        - performance
        - ui
        - utils
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: PR Summary
      description: A short summary of what this PR changes or adds.
      placeholder: Briefly describe the changes made in this PR
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Changes / Implementation Details
      description: A clear description of the implementation or fixes.
      placeholder: Describe what was changed, added, or removed
    validations:
      required: true

  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Reference any issues that this PR closes or relates to.
      placeholder: e.g., Closes #12
    validations:
      required: false

  - type: textarea
    id: test
    attributes:
      label: Test Plan
      description: How did you test these changes? Include steps if necessary.
      placeholder: Describe testing steps, expected results, and coverage
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Other Context
      description: Screenshots, logs, or other info relevant to this PR.
      placeholder: Add any other context here
    validations:
      required: false
